name: CryptVestAI CI

on: [push]

env:
    PM2_HOME: "/root/.pm2"
    PM2_LOC: "/usr/local/bin/pm2"
    DEPLOY_DIR: "/var/www/.profile/vearn-landing-page"
    GIT_USER: ${{ secrets.GIT_USER }}
    GIT_PASS: ${{ secrets.GIT_PASS }}
    REPO: ${{ github.repository }}

jobs:
    deploy:
        if: github.ref == 'refs/heads/main'
        runs-on: [ubuntu-latest]
        steps:
            - uses: actions/checkout@v1
            - name: Push to CIVAI server
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.NEW_SERVER_IP }}
                  username: ${{ secrets.NEW_SERVER_USER }}
                  key: ${{ secrets.SERVER_KEY }}
                  script:
                      cd ${{env.DEPLOY_DIR}} && sudo git stash && sudo git pull
                      https://${{env.GIT_USER}}:${{env.GIT_PASS}}@github.com/${{env.REPO}}.git main --no-edit && sudo docker-compose up -d --build
